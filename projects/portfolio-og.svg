<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Data Pilot — автоматизация ручного процесса за 2–5 дней</title>
  <desc id="desc">Автоматизация документов, таблиц, заявок и AI-сервисов с фиксированной ценой, исходниками и тестами.</desc>
  <rect width="1200" height="630" fill="#174f3a"/>
  <circle cx="1090" cy="5" r="244" fill="none" stroke="#d9f75d" stroke-opacity=".18" stroke-width="54"/>
  <circle cx="1090" cy="5" r="189" fill="none" stroke="#d9f75d" stroke-opacity=".34" stroke-width="2"/>
  <rect x="70" y="59" width="58" height="58" rx="18" fill="#d9f75d"/>
  <text x="151" y="101" fill="#fffdf7" font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="800" letter-spacing="1">DATA PILOT</text>
  <text x="70" y="230" fill="#dff3e5" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="2">PDF · EXCEL · ЗАЯВКИ · AI-СЕРВИСЫ</text>
  <text x="70" y="326" fill="#fffdf7" font-family="Segoe UI, Arial, sans-serif" font-size="70" font-weight="800" letter-spacing="-2">Автоматизация ручного</text>
  <text x="70" y="411" fill="#fffdf7" font-family="Segoe UI, Arial, sans-serif" font-size="70" font-weight="800" letter-spacing="-2">процесса <tspan fill="#d9f75d">за 2–5 дней</tspan></text>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">
    <rect x="70" y="491" width="254" height="64" rx="16" fill="#fffdf7"/>
    <text x="98" y="531" fill="#174f3a">Фиксированная цена</text>
    <rect x="340" y="491" width="240" height="64" rx="16" fill="#d9f75d"/>
    <text x="369" y="531" fill="#174f3a">Файлы + тесты</text>
    <rect x="596" y="491" width="244" height="64" rx="16" fill="none" stroke="#d9f75d" stroke-width="2"/>
    <text x="625" y="531" fill="#fffdf7">Разбор за 1 день</text>
  </g>
</svg>
