services:
  health:
    image: nginx:1.27-alpine
    ports:
      - target: 80
        published: 8080
        protocol: tcp
        mode: ingress
    deploy:
      replicas: 3
      placement:
        constraints:
          - node.role == worker
      restart_policy:
        condition: any
        delay: 2s
      update_config:
        order: start-first
      rollback_config:
        order: stop-first

  registry:
    image: registry:2.8.3
    ports:
      - target: 5000
        published: 5000
        protocol: tcp
        mode: ingress
    environment:
      REGISTRY_HTTP_TLS_CERTIFICATE: /run/secrets/foxbox_registry_cert
      REGISTRY_HTTP_TLS_KEY: /run/secrets/foxbox_registry_key
      REGISTRY_AUTH: htpasswd
      REGISTRY_AUTH_HTPASSWD_REALM: Fox Box controlled proof lab
      REGISTRY_AUTH_HTPASSWD_PATH: /run/secrets/foxbox_registry_htpasswd
    secrets:
      - foxbox_registry_cert
      - foxbox_registry_key
      - foxbox_registry_htpasswd
    volumes:
      - registry_data:/var/lib/registry
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == manager-1
      restart_policy:
        condition: any
        delay: 2s

secrets:
  foxbox_registry_cert:
    external: true
  foxbox_registry_key:
    external: true
  foxbox_registry_htpasswd:
    external: true

volumes:
  registry_data:
