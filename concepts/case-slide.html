<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Case slide</title><style>
*{box-sizing:border-box}html,body{margin:0;width:1600px;height:1000px;overflow:hidden;font-family:Inter,Arial,sans-serif;background:#070a10;color:#f7f8fb}.slide{width:1600px;height:1000px;padding:72px 84px;position:relative;background:radial-gradient(circle at 85% 5%,var(--a) 0,transparent 31%),radial-gradient(circle at 5% 95%,var(--b) 0,transparent 27%),#080b11}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:28px;font-weight:900;letter-spacing:-.04em}.tag{font-size:14px;color:#aab4c4;text-transform:uppercase;letter-spacing:.14em}.kicker{margin-top:74px;color:var(--b);font-weight:900;text-transform:uppercase;letter-spacing:.16em;font-size:13px}h1{font-size:86px;line-height:.92;letter-spacing:-.065em;margin:24px 0 26px;max-width:1050px}p{color:#aab4c4;font-size:21px;line-height:1.5;max-width:720px}.stage{position:absolute;right:84px;bottom:66px;width:690px;height:510px;border:1px solid rgba(255,255,255,.13);border-radius:34px;background:rgba(12,17,27,.86);box-shadow:0 32px 100px rgba(0,0,0,.5);padding:24px;transform:rotate(-2deg)}.dots{display:flex;gap:8px}.dots i{width:9px;height:9px;border-radius:50%;background:#738094}.screen{margin-top:22px;height:420px;border-radius:22px;background:linear-gradient(145deg,rgba(255,255,255,.08),rgba(255,255,255,.025));padding:28px}.screen h2{font-size:46px;margin:12px 0}.line{height:12px;border-radius:8px;background:rgba(255,255,255,.09);margin:12px 0}.line.short{width:58%}.metric{font-size:68px;font-weight:900;letter-spacing:-.06em;color:var(--b);margin-top:48px}.slideNo{position:absolute;left:84px;bottom:72px;font-size:15px;color:#78869a}.cols{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:48px}.panel{height:650px;border-radius:32px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.055);padding:34px}.panel h2{font-size:38px;margin:8px 0 30px}.cards{display:grid;grid-template-columns:1fr 1fr;gap:15px}.card{min-height:150px;border-radius:20px;background:rgba(255,255,255,.07);padding:22px}.card b{font-size:20px}.card span{display:block;color:#9aa7ba;margin-top:13px;line-height:1.4}.mobile{width:280px;height:560px;margin:auto;border:10px solid #212937;border-radius:42px;background:#0d131d;padding:25px;box-shadow:0 25px 60px rgba(0,0,0,.5)}.mobile .metric{font-size:44px}.flow{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-top:80px}.step{border:1px solid rgba(255,255,255,.14);border-radius:28px;padding:28px;min-height:230px;background:rgba(255,255,255,.045)}.step em{display:grid;place-items:center;width:46px;height:46px;border-radius:15px;background:var(--a);font-style:normal;font-weight:900}.step h3{font-size:25px;margin:28px 0 13px}.step p{font-size:16px}.impact{display:flex;gap:18px;margin-top:42px}.impact div{flex:1;border-radius:24px;padding:26px;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.12)}.impact b{font-size:38px;color:var(--b)}
</style></head><body><main class="slide" id="slide"></main><script>
const d={atlas:{n:'ATLAS AI',a:'#7654ff',b:'#22d8c2',t:'AI-контур для отдела продаж',desc:'Обращения, знания, CRM и контроль качества в одной управляемой системе.',metric:'−42%',items:['Классификация лидов','Ответ по базе знаний','Обновление CRM','Контроль качества']},nord:{n:'NORD ESTATE',a:'#a8792f',b:'#ead19d',t:'Цифровая витрина жилого квартала',desc:'Выбор корпуса, планировки и сценария покупки без давления и лишних шагов.',metric:'47',items:['Генплан','Подбор квартиры','Виды из окон','Ипотечный расчёт']},lumen:{n:'LUMEN CLOUD',a:'#3462ed',b:'#58e2a4',t:'Финансы компании без слепых зон',desc:'Деньги, договоры и дебиторка собраны в одном управленческом интерфейсе.',metric:'₽18.4M',items:['Платёжный календарь','Дебиторка','План-факт','Сценарии 90 дней']},forma:{n:'FORMA',a:'#bd572e',b:'#eac8a1',t:'Конфигуратор мебели на заказ',desc:'Материалы, размеры, бюджет и заявка дизайнеру в спокойном визуальном пути.',metric:'12 мин',items:['Конфигуратор','Материалы','Расчёт цены','Заявка дизайнеру']},volt:{n:'VOLTERRA',a:'#b99700',b:'#55e17c',t:'Корпоративный сайт энергокомпании',desc:'Сложные инженерные решения упакованы через отрасли, эффект и доказательства.',metric:'31%',items:['Отраслевые решения','Калькулятор эффекта','Кейсы в цифрах','Заявка инженеру']},medora:{n:'MEDORA',a:'#4968ef',b:'#78ead1',t:'Цифровой маршрут пациента',desc:'Выбор врача, подготовка, документы и назначения — просто и безопасно.',metric:'4.9',items:['Подбор врача','Запись','Личный кабинет','Назначения']},arden:{n:'ARDEN MARKET',a:'#df4128',b:'#ffd65a',t:'Редакционный интернет-магазин',desc:'Каталог, подборки и быстрый checkout для локальных брендов с характером.',metric:'2.1 сек',items:['Каталог','Карточка товара','Подборки','Checkout']},orbit:{n:'ORBIT OPS',a:'#008fd7',b:'#a875ff',t:'Личный кабинет сервисной компании',desc:'Заявки, документы, сроки, платежи и коммуникация в едином клиентском окне.',metric:'96%',items:['Заявки','Документы','Платежи','SLA-контроль']}};
const q=new URLSearchParams(location.search),x=d[q.get('c')||'atlas'],s=+(q.get('s')||1),el=document.querySelector('#slide');el.style.setProperty('--a',x.a);el.style.setProperty('--b',x.b);

if(s===2)el.innerHTML=top+`<div class="kicker">Структура продукта</div><h1 style="font-size:68px">Не одна страница.<br>Цельная система.</h1><div class="cols"><div class="panel"><h2>Ключевые разделы</h2><div class="cards">${x.items.map((v,i)=>`<div class="card"><b>0${i+1} · ${v}</b><span>Отдельный пользовательский сценарий с понятным результатом и состояниями.</span></div>`).join('')}</div></div><div class="panel"><h2>Интерфейс</h2><div class="screen" style="height:515px"><div class="tag">Рабочий экран</div><div class="metric">${x.metric}</div><div class="line"></div><div class="line"></div><div class="line short"></div><div class="cards" style="margin-top:45px"><div class="card">Данные</div><div class="card">Действие</div></div></div></div></div><div class="slideNo">02 / 04 · Внутренние страницы и модули</div>`;
if(s===3)el.innerHTML=top+`<div class="kicker">Desktop + mobile</div><h1 style="font-size:68px">Работает в реальном сценарии.</h1><div class="cols"><div class="panel"><h2>Функциональный экран</h2><div class="screen" style="height:520px"><div class="tag">${x.items[0]}</div><div class="metric">${x.metric}</div>${x.items.slice(1).map(v=>`<div class="card" style="min-height:72px;margin-top:12px"><b>${v}</b></div>`).join('')}</div></div><div class="panel"><h2 style="text-align:center">Мобильная версия</h2><div class="mobile"><div class="tag">${x.n}</div><div class="metric">${x.metric}</div><div class="line"></div><div class="line short"></div>${x.items.slice(0,2).map(v=>`<div class="card" style="min-height:95px;margin-top:16px"><b>${v}</b></div>`).join('')}</div></div></div><div class="slideNo">03 / 04 · Функционал и адаптивность</div>`;
if(s===4)el.innerHTML=top+`<div class="kicker">Путь до запуска</div><h1 style="font-size:68px">От задачи — к проверяемому результату.</h1><div class="flow">${[['01','Scope','Сценарии, данные и критерии приёмки.'],['02','Prototype','Ключевой путь без лишних экранов.'],['03','Build','Адаптивная реализация и интеграции.'],['04','QA + launch','Проверка, инструкция и безопасный запуск.']].map(v=>`<div class="step"><em>${v[0]}</em><h3>${v[1]}</h3><p>${v[2]}</p></div>`).join('')}</div><div class="impact"><div><div class="tag">Формат</div><b>Письменно</b><p>Прозрачный scope и этапы</p></div><div><div class="tag">Приёмка</div><b>По чек-листу</b><p>Без субъективного «почти готово»</p></div><div><div class="tag">Результат</div><b>Исходники</b><p>Инструкция и права у заказчика</p></div></div><div class="slideNo">04 / 04 · Процесс и поставка</div>`;
</script></body></html>
