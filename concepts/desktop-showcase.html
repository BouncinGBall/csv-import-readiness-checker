<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Экран концепта</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:var(--bg);color:var(--ink);font-family:Inter,Arial,sans-serif}.board{position:relative;width:1600px;height:1000px;padding:66px 82px;overflow:hidden;background:radial-gradient(circle at 85% 0,var(--glow),transparent 38%),var(--bg)}.top{display:flex;justify-content:space-between;align-items:end;margin-bottom:34px}.eyebrow{color:var(--accent);font-size:12px;font-weight:900;letter-spacing:.18em;text-transform:uppercase}.top h1{margin:14px 0 0;font-size:58px;line-height:.94;letter-spacing:-.055em}.top p{max-width:520px;margin:0;color:var(--muted);font-size:18px;line-height:1.55}.browser{position:relative;height:720px;overflow:hidden;border:1px solid var(--line);border-radius:28px;background:#fff;box-shadow:0 38px 100px #0004}.chrome{display:flex;align-items:center;gap:9px;height:48px;padding:0 17px;background:#e8e9ed;border-bottom:1px solid #c9cbd1}.chrome i{width:10px;height:10px;border-radius:50%;background:#ff6b61}.chrome i:nth-child(2){background:#f7c84b}.chrome i:nth-child(3){background:#54c56d}.url{width:52%;margin:auto;padding:7px 15px;border-radius:8px;background:#fff;color:#8a8c94;font-size:11px}.view{position:absolute;left:0;right:0;top:48px;height:672px;overflow:hidden;background:#fff}.view iframe{width:1600px;height:1000px;border:0;transform:scale(.8975);transform-origin:0 0}.badge{position:absolute;right:22px;bottom:20px;z-index:4;padding:10px 13px;border-radius:10px;background:var(--accent);color:var(--badge);font-size:11px;font-weight:950;letter-spacing:.08em;text-transform:uppercase}.index{position:absolute;right:20px;top:18px;color:var(--muted);font-size:11px;letter-spacing:.13em}
  </style>
</head>
<body><main class="board"><div class="index" id="index"></div><header class="top"><div><div class="eyebrow" id="eyebrow"></div><h1 id="title"></h1></div><p id="description"></p></header><section class="browser"><div class="chrome"><i></i><i></i><i></i><div class="url" id="url"></div></div><div class="view"><iframe id="preview" title="Внутренний экран концепта"></iframe></div><div class="badge" id="badge"></div></section></main>
  <script>
    const data={
      atlas:{file:'atlas-ai.html',name:'ATLAS AI',accent:'#9dff63',badge:'#090a0c',bg:'#0a0b0f',ink:'#f6f4ff',muted:'#a7a4b0',line:'#34313d',glow:'#443b8c66',slides:[['Управляемая AI-система','Не просто чат: правила, источники и контроль каждого действия видны команде.',.58],['Доказательства вместо магии','В интерфейсе собраны интеграции, журнал решений и точки подтверждения человеком.',.88]]},
      nord:{file:'nord-estate.html',name:'NORD ESTATE',accent:'#1f251f',badge:'#fff',bg:'#d9d4ca',ink:'#1f251f',muted:'#565b54',line:'#87877d',glow:'#ffffff66',slides:[['Архитектура выбора','Планировки и характеристики превращены в спокойный редакционный сценарий.',.52],['Карточка планировки','Ключевые параметры и следующий шаг остаются заметными без рекламного шума.',.82]]},
      lumen:{file:'lumen-finance.html',name:'LUMEN CLOUD',accent:'#6f63ff',badge:'#fff',bg:'#ebecef',ink:'#161821',muted:'#666a75',line:'#cacdd5',glow:'#6f63ff30',slides:[['Финансы одним взглядом','Денежный поток, план месяца и риски собраны на одном управленческом экране.',.24],['Операции без слепых зон','Статусы, назначения и суммы читаются быстро даже в насыщенной таблице.',.74]]},
      forma:{file:'forma-interior.html',name:'FORMA',accent:'#a94425',badge:'#fff',bg:'#e1cdb4',ink:'#2b211a',muted:'#6c5748',line:'#2b211a',glow:'#b66e4850',slides:[['Путь к точному проекту','Сложный выбор разбит на четыре понятных шага — от пространства до расчёта.',.48],['Конфигуратор без перегруза','Материалы, размеры и комплектация собираются в одном последовательном сценарии.',.78]]},
      volterra:{file:'volterra-energy.html',name:'VOLTERRA',accent:'#f0d600',badge:'#111',bg:'#e6e6df',ink:'#111',muted:'#5e5e58',line:'#111',glow:'#f0d60055',slides:[['Инженерия на языке бизнеса','Отраслевые решения раскрыты через понятный процесс и центр ответственности.',.48],['Три этапа реализации','Проектирование, строительство и эксплуатация складываются в цельную систему.',.78]]},
      medora:{file:'medora-clinic.html',name:'MEDORA',accent:'#6576f4',badge:'#fff',bg:'#edf0fb',ink:'#26334d',muted:'#66728c',line:'#d4d9e8',glow:'#6576f43d',slides:[['Спокойный путь пациента','Поиск врача, запись и документы объяснены простыми словами и мягким интерфейсом.',.38],['Сервис после записи','История, назначения и напоминания остаются в едином понятном пространстве.',.7]]},
      arden:{file:'arden-market.html',name:'ARDEN MARKET',accent:'#ef5539',badge:'#fff',bg:'#eadfc9',ink:'#161410',muted:'#635b4d',line:'#171510',glow:'#df4b3155',slides:[['Каталог как редакция','Категории работают как крупные визуальные главы, а не бесконечная сетка товаров.',.45],['Контент, который продаёт','История коллекции ведёт к покупке без баннерного шума и лишних элементов.',.74]]},
      orbit:{file:'orbit-ops.html',name:'ORBIT OPS',accent:'#53f2b3',badge:'#06110d',bg:'#07100d',ink:'#e8fff6',muted:'#8aafa1',line:'#255142',glow:'#23d59b3f',slides:[['Командный центр процессов','SLA, риски и активные заявки собраны в одном операционном экране.',.24],['Работа по статусам','Канбан и журнал событий показывают следующий шаг без поиска по чатам.',.58]]}
    };
    const params=new URLSearchParams(location.search),key=params.get('c')||'atlas',slide=Math.max(2,Math.min(3,Number(params.get('s'))||2)),item=data[key]||data.atlas,content=item.slides[slide-2];
    for(const [k,v] of Object.entries({accent:item.accent,badge:item.badge,bg:item.bg,ink:item.ink,muted:item.muted,line:item.line,glow:item.glow}))document.documentElement.style.setProperty(`--${k}`,v);
    document.querySelector('#eyebrow').textContent=`${item.name} · экран ${slide}`;document.querySelector('#title').textContent=content[0];document.querySelector('#description').textContent=content[1];document.querySelector('#url').textContent=`laditsya.design/concepts/${key}`;document.querySelector('#badge').textContent='Концепт';document.querySelector('#index').textContent=`0${slide} / 04`;
    const frame=document.querySelector('#preview');frame.src=item.file;frame.addEventListener('load',()=>{const doc=frame.contentDocument;doc.documentElement.style.scrollBehavior='auto';const max=Math.max(0,doc.documentElement.scrollHeight-1000);frame.contentWindow.scrollTo(0,max*content[2])});
  </script>
</body>
</html>
